<!DOCTYPE html>
<!-- ==========================================================================
  《重生之我在破败家族力挽狂澜》桌面版入口
  ----------------------------------------------------------------------------
  怎么玩：直接双击本文件（index.html），用浏览器打开即可，无需安装任何东西。
  注意：本文件依赖 ../core/ 目录里的 data.js 和 engine.js 与 ../assets/ 插画，
        请不要单独把本文件移出项目文件夹。

  文件结构：样式表 → 页面骨架（双栏：左主区/右手账） → 引擎加载 → 界面逻辑
  @version 0.3.1
=========================================================================== -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#cf7361">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="../assets/manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/dad_ok.png">
<title>重生之我在破败家族力挽狂澜</title>
<style>
/* ==========================================================================
   全局：柔和暖米手账风 v0.7.0 —— 标准经营游戏布局
   首屏=产业（每周净收益 + 产业列表），钱挂在顶栏，无独立主页仪表盘
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  background: linear-gradient(180deg, #f6eee0 0%, #f1e6d2 100%);
  color: #574a3f;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  line-height: 1.7;
}
#app {
  max-width: 560px; margin: 0 auto; min-height: 100vh;
  padding: 0 0 calc(76px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, #f8f0e2 0%, #f1e6d2 100%);
  box-shadow: 0 0 40px rgba(166, 138, 98, .18);
  position: relative;
}
@media (min-width: 640px) {
  #app { border-left: 1px solid #e9dcc6; border-right: 1px solid #e9dcc6; }
}

/* ---- 顶栏：第一行标题+周数+结束本周；第二行资金芯片 ---- */
header.m-head {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, #fbf5e9, #f6ecda);
  border-bottom: 1px solid #e9dcc6;
  padding: 8px 12px 6px;
}
.mh-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mh-title {
  font-family: "Kaiti SC", "KaiTi", serif;
  font-size: 17px; font-weight: 900; color: #c96855; letter-spacing: 2px;
  white-space: nowrap; flex-shrink: 0;
}
.mh-right { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.mh-crisis {
  font-size: 11px; font-weight: bold; color: #b56a5c;
  background: #fbeae5; border: 1px solid #ecccc2;
  border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.mh-crisis:empty { display: none; }
.mh-right .week {
  color: #fff; background: linear-gradient(180deg, #d8826f, #c96855);
  font-weight: bold; font-size: 12px; white-space: nowrap;
  padding: 2px 10px; border-radius: 999px;
  box-shadow: 0 3px 8px rgba(207, 115, 97, .3);
}
.mh-right .ap { font-size: 13px; color: #574a3f; white-space: nowrap; }
.mh-right .ap b { color: #cf7361; letter-spacing: 2px; }
.endweek-mini {
  font-size: 12px; font-weight: 900; color: #fff3e4;
  background: linear-gradient(180deg, #d8826f, #c96855);
  border: none; border-radius: 999px; padding: 5px 12px;
  box-shadow: 0 3px 8px rgba(207, 115, 97, .35); cursor: pointer; white-space: nowrap;
}
.endweek-mini:active { transform: translateY(1px); }

/* 资金芯片行（现金/钱包/负债/产业） */
.chips {
  display: flex; gap: 6px; margin-top: 7px;
  overflow-x: auto; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
  background: #fdfaf3; border: 1px solid #e9dcc6; border-radius: 999px;
  padding: 3px 12px; font-size: 12px; color: #9a8b77;
  box-shadow: 0 2px 6px rgba(166, 138, 98, .12);
}
.chip b { color: #52463c; font-size: 13px; }
.chip.warn b { color: #c4685a; }
.chip.good b { color: #7a9a63; }

/* ---- 面板容器 ---- */
.panel { display: none; padding: 12px 14px 20px; }
.panel.active { display: block; animation: panelIn .18s ease; }
@keyframes panelIn {
  from { opacity: .4; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- 产业首屏：每周净收益大字卡 ---- */
.income-card {
  background: linear-gradient(180deg, #d8826f, #c96855);
  border-radius: 18px; color: #fff3e4;
  padding: 14px 18px 12px; text-align: center;
  box-shadow: 0 8px 20px rgba(207, 115, 97, .3);
  margin-bottom: 12px;
}
.ic-label { font-size: 12px; letter-spacing: 4px; opacity: .9; }
.ic-num { font-size: 34px; font-weight: 900; line-height: 1.3; }
.ic-num.neg { color: #ffe1d6; }
.ic-sub { font-size: 11px; opacity: .85; }

/* 软属性条（声望/士气/魅力/员工/产品线/产业） */
.stat-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stat-strip .chip b { color: #52463c; }

/* ---- 父亲面板（生活页顶部，紧凑） ---- */
#dadPanel {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px; padding: 10px 14px 10px 10px;
  background: #fdfaf3; border: 1px solid #e9dcc6; border-radius: 18px;
  box-shadow: 0 6px 16px rgba(166, 138, 98, .14);
}
#dadImg {
  width: 84px; height: 84px; object-fit: contain;
  border-radius: 14px; background: #f7efe0; flex-shrink: 0;
  animation: breathe 3.4s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.dad-info { flex: 1; }
.dad-name { font-weight: 900; font-size: 14px; margin-bottom: 2px; color: #574a3f; }
.dad-name span { color: #cf7361; }
#dadText { color: #9a8b77; font-size: 12px; margin-bottom: 5px; }
.hpbar { height: 12px; border-radius: 999px; background: #f0e6d4; overflow: hidden; }
#hpFill { height: 100%; width: 50%; background: linear-gradient(90deg, #e89a8a, #f2bcaa); transition: width .3s; }

/* ---- 行动分组与按钮 ---- */
#panels h3 {
  display: inline-flex; align-items: center; gap: 6px;
  color: #fff; font-size: 13px; letter-spacing: 3px;
  padding: 3px 16px; margin: 12px 0 8px;
  border-radius: 999px;
  box-shadow: 0 3px 8px rgba(166, 138, 98, .25);
}
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.actbtn {
  width: 100%; padding: 10px 13px 9px; text-align: left;
  background: #fdfaf3; color: #52463c; border: 1px solid #e9dcc6;
  border-left-width: 5px;
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(166, 138, 98, .12);
  cursor: pointer; font-size: 14px; font-weight: bold;
  transition: transform .1s, box-shadow .1s, background .1s;
}
.actbtn:hover:not(:disabled) {
  background: #fffaef; transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(166, 138, 98, .22);
}
.actbtn:active:not(:disabled) { transform: translateY(0); box-shadow: 0 3px 8px rgba(166, 138, 98, .15); }
.actbtn:disabled { opacity: .45; cursor: not-allowed; }
.actbtn .ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ac, #f2e6cf); font-size: 16px;
  margin-right: 8px; vertical-align: middle;
}
.actbtn .tok {
  float: right; margin-left: 8px; margin-top: 2px;
  font-size: 11px; font-weight: 900; padding: 1px 9px; border-radius: 999px;
}
.actbtn .tok.gain { background: #e8f0dd; color: #6b8f4e; }
.actbtn .tok.cost { background: #f2e6cf; color: #8a6f45; }
.actbtn .tok.lack { background: #f6ded7; color: #b5574a; }
.actbtn .tok.dim  { background: #f0ead9; color: #a3957f; }
.actbtn .hint {
  display: none;
  color: #a3957f; font-size: 11px; font-weight: normal;
  margin-top: 4px; line-height: 1.55;
}
body.show-hints .actbtn .hint { display: block; }

/* 主页小按钮行（玩法/说明/重开，挂在产业页底部） */
.home-btnrow { display: flex; gap: 10px; margin-top: 14px; }
.home-btnrow button {
  flex: 1; padding: 8px 4px; font-size: 12px; font-weight: bold;
  background: #fdfaf3; color: #7a695a; border: 1px solid #e3d5be;
  border-radius: 12px; cursor: pointer; white-space: nowrap;
}

/* ---- 手账页 ---- */
#logpanel {
  background: #fefbf4; border: 1px solid #e9dcc6; border-radius: 18px;
  box-shadow: 0 6px 16px rgba(166, 138, 98, .14);
  padding: 12px 16px; height: calc(100vh - 210px); overflow-y: auto;
  font-family: "Kaiti SC", "KaiTi", serif;
  font-size: 14px;
}
#logpanel p { margin: 3px 0; color: #6b5c4d; }
#logpanel p.weekmark { color: #c0776b; font-weight: bold; margin-top: 10px; }

/* ---- 底部标签栏 ---- */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; z-index: 30;
  display: flex;
  background: #fdfaf3;
  border-top: 1px solid #e9dcc6;
  box-shadow: 0 -4px 16px rgba(166, 138, 98, .18);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
}
#tabbar .tbtn {
  flex: 1; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  color: #b3a48e; font-size: 11px; font-weight: bold;
  padding: 4px 0; border-radius: 12px;
  transition: color .12s;
}
#tabbar .tbtn .ticon { font-size: 22px; line-height: 1.2; }
#tabbar .tbtn.active { color: #c96855; }
#tabbar .tbtn.active .ticon { transform: scale(1.12); }

/* ---- 弹窗 ---- */
#overlay {
  position: fixed; inset: 0; display: none;
  background: rgba(90, 74, 62, .45); z-index: 50;
  justify-content: center; align-items: center;
  padding: 16px;
}
#overlay.show { display: flex; }
.dialog {
  width: min(540px, 100%); max-height: 86vh; overflow-y: auto;
  background: #fdfaf3; border: 1px solid #e9dcc6; border-radius: 22px;
  padding: 22px 22px; box-shadow: 0 20px 50px rgba(90, 74, 62, .3);
}
.dialog h2 { color: #c96855; font-size: 19px; margin-bottom: 12px; letter-spacing: 1px; }
.dialog .body { white-space: pre-wrap; font-size: 14px; color: #6b5c4d; margin-bottom: 16px; }
.dialog .choices button {
  display: block; width: 100%; margin: 10px 0; padding: 12px 16px;
  background: #fdfaf3; color: #52463c; border: 1px solid #e9dcc6;
  border-radius: 14px; box-shadow: 0 4px 10px rgba(166, 138, 98, .12);
  cursor: pointer; font-size: 14px; font-weight: bold; text-align: left;
  transition: background .12s, transform .1s;
}
.dialog .choices button:hover { background: #f7ead2; transform: translateY(-2px); }
.dialog .ending-title { font-size: 30px; text-align: center; margin: 10px 0; letter-spacing: 4px; }
.dialog .ending-rank0 .ending-title { color: #c0776b; }
.dialog .ending-rank2 .ending-title { color: #8fae7a; }
.dialog .ending-rank3 .ending-title { color: #7c99b8; }
.dialog .ending-rank4 .ending-title { color: #c99a4b; }
.dialog .ending-rank5 .ending-title { color: #d9a95c; text-shadow: 0 2px 10px rgba(217, 169, 92, .35); }

</style>
</head>
<body>
<div id="app">
  <!-- 顶栏：标题/周数/危机/行动点/结束本周 + 资金芯片（标准经营布局） -->
  <header class="m-head">
    <div class="mh-row1">
      <div class="mh-title">破败家族</div>
      <div class="mh-right">
        <span class="week" id="weekLabel" title="当前周数">1/48周</span>
        <span class="ap" id="apLabel" title="行动点"></span>
        <button id="btnEndWeek" class="endweek-mini">结束本周 ▶</button>
      </div>
    </div>
    <div class="chips" id="moneyChips">
      <span class="mh-crisis" id="crisisChip" title="下一场危机倒计时"></span>
      <span class="chip" id="chipCash" title="公司账户">💼 <b>-</b></span>
      <span class="chip" id="chipPocket" title="个人钱包">👛 <b>-</b></span>
      <span class="chip" id="chipDebt" title="家族负债">⛓️ <b>-</b></span>
      <span class="chip" id="chipAsset" title="产业总值">🏬 <b>-</b></span>
    </div>
  </header>

  <main id="panels">
    <!-- 首屏：产业（每周净收益 + 产业列表） -->
    <section id="tab-assets" class="panel active">
      <div class="income-card">
        <div class="ic-num" id="weekNet">-</div>
        <div class="ic-sub" id="weekNetSub"></div>
      </div>
      <div class="stat-strip" id="statStrip"></div>
      <div id="actions-assets"></div>
      <div class="home-btnrow">
        <button id="btnHelp">📖 玩法</button>
        <button id="btnHints">📝 说明:关</button>
        <button id="btnRestart">🔄 重开</button>
      </div>
    </section>

    <!-- 经营行动 -->
    <section id="tab-biz" class="panel"><div id="actions-biz"></div></section>

    <!-- 生活：父亲 + 家庭/人脉/投资/转账 -->
    <section id="tab-life" class="panel">
      <div id="dadPanel">
        <img id="dadImg" src="../assets/dad_ok.png" alt="父亲">
        <div class="dad-info">
          <div class="dad-name">病床上的父亲 <span id="dadHpText">55 / 100</span></div>
          <div id="dadText">病情平稳，需要持续治疗。</div>
          <div class="hpbar"><div id="hpFill"></div></div>
        </div>
      </div>
      <div id="actions-life"></div>
    </section>

    <!-- 暗线：查真相/道具/金手指 -->
    <section id="tab-secret" class="panel"><div id="actions-secret"></div></section>

    <!-- 手账：全部日志 -->
    <section id="tab-log" class="panel">
      <div id="logpanel"></div>
    </section>
  </main>

  <!-- 底部标签导航 -->
  <nav id="tabbar">
    <button class="tbtn active" data-tab="tab-assets"><span class="ticon">🏬</span><span>产业</span></button>
    <button class="tbtn" data-tab="tab-biz"><span class="ticon">🏭</span><span>经营</span></button>
    <button class="tbtn" data-tab="tab-life"><span class="ticon">🍵</span><span>生活</span></button>
    <button class="tbtn" data-tab="tab-secret"><span class="ticon">🔍</span><span>暗线</span></button>
    <button class="tbtn" data-tab="tab-log"><span class="ticon">📒</span><span>手账</span></button>
  </nav>
</div>

<!-- 弹窗遮罩：开场说明 / 随机事件 / 结局 三种内容复用 -->
<div id="overlay"><div class="dialog" id="dialog"></div></div>

<!-- 共享引擎（顺序不能颠倒：先数据后引擎）。?v= 用于发布时强制刷新缓存 -->
<script src="../core/data.js?v=070"></script>
<script src="../core/engine.js?v=070"></script>

<script>
/* ==========================================================================
   4. 桌面端界面逻辑
   ----------------------------------------------------------------------------
   职责只有三件事：
     A. 把引擎的 state 画到页面上（render 函数）
     B. 把按钮点击翻译成引擎调用（performAction / endWeek / resolveEvent）
     C. 用 localStorage 存档读档（键名用引擎给 SAVE_KEY，三端一致）
   ========================================================================== */

var state = null;                       // 当前的游戏进度（引擎.newGame 产生）

/* ---- 视觉主题：各行动分组的主题色（按钮左色条 + 图标气泡底色） ---- */
var GROUP_COLORS = {
  '经营':   '#c99a4b',
  '产品线': '#6fa098',
  '员工':   '#c98b5e',
  '产业':   '#4f8f7a',
  '债务':   '#c0776b',
  '转账':   '#7c99b8',
  '家庭':   '#8faf7e',
  '人脉':   '#7c93b8',
  '暗线':   '#9a85b8',
  '投资':   '#96a86b',
  '道具':   '#a98bc0',
  '金手指': '#dbb160'
};

/** 数值卡配置：图标 + 顶部主题色（v0.3.2 柔和版） */
var STAT_META = {
  stCash:   { icon: '🏢', ac: '#c99a4b' },
  stPocket: { icon: '👛', ac: '#dbb160' },
  stDebt:   { icon: '⛓️', ac: '#c0776b' },
  stHealth: { icon: '❤️', ac: '#8faf7e' },
  stRep:    { icon: '⭐', ac: '#7c93b8' },
  stMorale: { icon: '🔥', ac: '#c98b5e' },
  stCharm:  { icon: '✨', ac: '#d3939f' },
  stStaff:  { icon: '🧑‍🏭', ac: '#6fa098' },
  stProduct:{ icon: '📦', ac: '#9a85b8' },
  stAsset:  { icon: '🏬', ac: '#4f8f7a' },
  stEquip:  { icon: '🔧', ac: '#96a86b' }
};

/** 记录上一帧的数值文本，用于"变化闪光"动画 */
var prevStatText = {};

/** 快捷取 DOM */
function $(id) { return document.getElementById(id); }

/* ---- 存档 / 读档 ------------------------------------------------------- */
function saveGame() {
  try { localStorage.setItem(Engine.SAVE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn('存档失败（可能处于无痕模式）', e); }
}
function loadGame() {
  try {
    var raw = localStorage.getItem(Engine.SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

/* ---- 渲染：状态栏 ------------------------------------------------------ */
function render() {
  // 全部"图标+数字"（v0.7.1 文字再瘦身），名字靠悬停提示
  $('weekLabel').textContent = Math.min(state.week, CONFIG.MAX_WEEKS) + '/' + CONFIG.MAX_WEEKS + '周';

  // 危机倒计时提示（学自开源文字游戏的常驻关键信息条）
  var nc = Engine.nextCrisisWeek(state);
  $('crisisChip').textContent = nc ? '⚠' + nc + '周' : '';

  // 行动点用圆点表示：●●○
  var dots = '';
  for (var i = 0; i < CONFIG.AP_PER_WEEK; i++) { dots += (i < state.ap) ? '●' : '○'; }
  $('apLabel').innerHTML = '<b>' + dots + '</b>';

  // 父亲病房面板：插画随健康分三档切换 + 康复状态；配一句状态文案 + 血条
  var tier = state.flags.dadRecovered ? 'recovered'
    : (state.health >= 70 ? 'happy' : (state.health >= 40 ? 'ok' : 'sick'));
  if (state.flags.dadRecovered) {
    $('dadImg').src = '../assets/dad_happy.png';
    $('dadHpText').textContent = '100 / 100 · 已康复 🎗️';
    $('dadText').textContent = '疗程成功，父亲痊愈了。他每天去厂里转转，比谁都精神。';
    $('hpFill').style.width = '100%';
  } else {
    $('dadImg').src = '../assets/dad_' + tier + '.png';
    $('dadHpText').textContent = state.health + ' / 100';
    $('dadText').textContent =
      tier === 'happy' ? '今天精神不错，还念叨着要下床去车间看看。' :
      tier === 'ok'    ? '病情平稳，每周的治疗一天都不能断。' :
                         '咳嗽得厉害，夜里总睡不安——他需要更好的治疗。';
    $('hpFill').style.width = state.health + '%';
  }

  // 资金芯片（顶栏第二行）：图标+数字
  setChip('chipCash', Engine.money(state.cash), state.cash < CONFIG.WEEKLY_WAGE * 2 ? 'warn' : '');
  setChip('chipPocket', Engine.money(state.pocket), state.pocket < CONFIG.MEDICAL_COST ? 'warn' : '');
  setChip('chipDebt', Engine.money(state.debt), state.debt > CONFIG.DEBT_CRUSH * 0.8 ? 'warn' : '');
  var ownedVal = 0, totalVal = 0;
  for (var ai = 0; ai < ASSETS.length; ai++) {
    totalVal += ASSETS[ai].cost;
    if (state.assets[ASSETS[ai].id]) { ownedVal += ASSETS[ai].cost; }
  }
  setChip('chipAsset', Engine.money(ownedVal), ownedVal === totalVal && totalVal > 0 ? 'good' : '');

  // 软属性条：图标+数字（名字看悬停提示）
  var strip = [
    ['⭐', state.reputation, '声望'],
    ['🔥', state.morale, '士气'],
    ['✨', state.charm, '魅力'],
    ['🧑‍🏭', (state.staff || 0) + '/' + CONFIG.STAFF_MAX, '员工'],
    ['📦', productLevelText(), '产品线'],
    ['🔧', 'Lv.' + state.equipment, '设备'],
    ['🔍', state.investigation + '%', '调查进度']
  ];
  var stripHtml = '';
  for (var si = 0; si < strip.length; si++) {
    stripHtml += '<span class="chip" title="' + strip[si][2] + '">' + strip[si][0]
      + ' <b>' + strip[si][1] + '</b></span>';
  }
  $('statStrip').innerHTML = stripHtml;

  // 每周净流（经营模拟的"心跳"数字）：产业+自动订单-工资-利息-维护
  var companyNet = Engine.assetWeeklyIncome(state)
    + (state.assets.manager ? Engine.estimateOrder(state) : 0)
    - CONFIG.WEEKLY_WAGE - (state.staff || 0) * CONFIG.STAFF_WEEKLY_WAGE
    - Engine.productLevels(state) * CONFIG.PRODUCT_MAINTENANCE
    - (state.debt > 0 && !state.flags.deferInterest
        ? Math.round(state.debt * CONFIG.WEEKLY_INTEREST_RATE) : 0);
  var netEl = $('weekNet');
  netEl.textContent = (companyNet >= 0 ? '+' : '') + Engine.money(companyNet);
  netEl.className = 'ic-num' + (companyNet < 0 ? ' neg' : '');
  $('weekNetSub').textContent = '每周 · 钱包 +' + money(CONFIG.WEEKLY_POCKET_SALARY);

  renderActions();
  renderLog();

  // 结局弹窗优先级最高
  if (state.ended) { showEnding(); return; }
  // 有待处理事件 → 强制弹事件窗（此时行动按钮已全部禁用）
  if (state.pendingEvent) { showEvent(state.pendingEvent); return; }
  hideOverlay();
}

/** 产品线等级显示：如 "1·0·2"（果脯/罐头/礼盒），配合 PRODUCTS 数据顺序 */
function productLevelText() {
  var p = state.products || {};
  var out = [];
  for (var i = 0; i < PRODUCTS.length; i++) { out.push(p[PRODUCTS[i].id] || 0); }
  return out.join('·');
}

/** 给数值卡注入迷你进度条（只在首次调用时创建 DOM） */
function setBar(id, pct) {
  var el = $(id);
  var bar = el.querySelector('.sbar');
  if (!bar) {
    bar = document.createElement('i');
    bar.className = 'sbar';
    bar.innerHTML = '<b></b>';
    el.appendChild(bar);
  }
  bar.firstChild.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

/** 更新资金芯片（顶栏第二行） */
function setChip(id, text, cls) {
  var el = $(id);
  el.querySelector('b').textContent = text;
  el.className = 'chip' + (cls ? ' ' + cls : '');
}

/** 更新单个数值卡片（图标注入 + 主题色 + 数值变化闪光） */
function setStat(id, text, cls) {
  var el = $(id);
  var meta = STAT_META[id] || {};
  var valEl = el.querySelector('.value');
  var labEl = el.querySelector('.label');
  // 图标进标签行（只注入一次）
  if (meta.icon && labEl && labEl.getAttribute('data-icon') !== meta.icon) {
    labEl.setAttribute('data-icon', meta.icon);
    labEl.innerHTML = meta.icon + ' ' + labEl.textContent;
  }
  if (meta.ac) { el.style.setProperty('--ac', meta.ac); }
  // 数值变化 → 闪光动画
  if (valEl.textContent !== '-' && prevStatText[id] !== undefined && prevStatText[id] !== text) {
    el.classList.remove('flash');
    void el.offsetWidth;                    // 强制重排以重启动画
    el.classList.add('flash');
  }
  prevStatText[id] = text;
  valEl.textContent = text;
  el.className = 'stat' + (cls ? ' ' + cls : '');
  if (meta.ac) { el.style.setProperty('--ac', meta.ac); }   // className 重置后补回主题色
}

/* ---- 渲染：行动按钮（按数据分组 → 分发到对应底部标签页） ---------------- */
/** 分组 → 底部标签 的归属（改分组名记得同步这里） */
var GROUP_TAB = {
  '经营': 'actions-biz', '产品线': 'actions-biz', '员工': 'actions-biz',
  '产业': 'actions-assets',
  '家庭': 'actions-life', '人脉': 'actions-life', '投资': 'actions-life', '转账': 'actions-life',
  '暗线': 'actions-secret', '道具': 'actions-secret', '金手指': 'actions-secret'
};

/**
 * 按钮上的一行式标注（v0.5.1，学自增量游戏）：
 * 成本/收益/库存直接标在按钮名字后面，不点开就知道值不值。
 * 返回 { text, cls }：cls = 'gain'(绿色收益) | 'cost'(成本) | 'dim'(中性)。
 * 成本类如果当前付不起，cls 变 'lack'（红色警示）。
 */
function tokenFor(action) {
  var s = state, id = action.id, C = CONFIG;
  function lackCash(n) { return s.cash < n; }
  function lackPocket(n) { return s.pocket < n; }
  switch (id) {
    case 'order':       return { text: '+' + Engine.money(Engine.estimateOrder(s)), cls: 'gain' };
    case 'buy_material': return { text: money(15000), cls: lackCash(15000) ? 'lack' : 'cost' };
    case 'upgrade':     return { text: money(Engine.upgradeCost(s)), cls: lackCash(Engine.upgradeCost(s)) ? 'lack' : 'cost' };
    case 'booth':       return { text: '+2000', cls: 'gain' };
    case 'develop_gua':
    case 'develop_guan':
    case 'develop_lihe': {
      var pid = id.replace('develop_', '');
      var prod = Engine.findProduct(pid);
      var lv = s.products[pid] || 0;
      if (lv >= 3) { return { text: '已满级', cls: 'dim' }; }
      var c = Engine.productCost(prod, lv);
      return { text: money(c), cls: lackCash(c) ? 'lack' : 'cost' };
    }
    case 'hire_staff':  return s.staff >= C.STAFF_MAX ? { text: '满员', cls: 'dim' }
      : { text: money(C.STAFF_HIRE_COST), cls: lackCash(C.STAFF_HIRE_COST) ? 'lack' : 'cost' };
    case 'fire_staff':  return s.staff <= 0 ? { text: '无人', cls: 'dim' } : { text: '省' + money(C.STAFF_WEEKLY_WAGE) + '/周', cls: 'gain' };
    case 'negotiate':   return { text: '本周免息', cls: 'gain' };
    case 'repay':       return s.debt <= 0 ? { text: '无债', cls: 'dim' }
      : { text: money(Math.min(C.REPAY_AMOUNT, s.debt)), cls: lackCash(Math.min(C.REPAY_AMOUNT, s.debt)) ? 'lack' : 'cost' };
    case 'transfer_s':  return { text: '实到4.5万', cls: lackCash(C.TRANSFER_S_AMOUNT) ? 'lack' : 'cost' };
    case 'transfer_l':  return { text: '实到18万', cls: lackCash(C.TRANSFER_L_AMOUNT) ? 'lack' : 'cost' };
    case 'care':        return { text: '❤+8', cls: 'gain' };
    case 'medical': {
      var mc = Engine.medicalCost(s);
      return { text: money(mc), cls: lackPocket(mc) ? 'lack' : 'cost' };
    }
    case 'chamber':     return { text: '声望+4', cls: 'gain' };
    case 'media':       return { text: '声望+8', cls: 'gain' };
    case 'investigate': return { text: '+' + (10) + '~18%', cls: 'gain' };
    case 'invest_low':  return { text: money(C.INVEST_LOW_AMOUNT), cls: lackPocket(C.INVEST_LOW_AMOUNT) ? 'lack' : 'cost' };
    case 'invest_high': return { text: money(C.INVEST_HIGH_AMOUNT), cls: lackPocket(C.INVEST_HIGH_AMOUNT) ? 'lack' : 'cost' };
    case 'use_aid':     return (s.items.aid > 0) ? { text: '×' + s.items.aid, cls: 'gain' } : { text: '×0', cls: 'dim' };
    case 'use_invite':  return (s.items.invite > 0) ? { text: '×' + s.items.invite, cls: 'gain' } : { text: '×0', cls: 'dim' };
    case 'buy_chicken': return { text: money(C.CHICKEN_COST), cls: lackCash(C.CHICKEN_COST) ? 'lack' : 'cost' };
    case 'use_chicken': return (s.items.chicken > 0 && s.history.length > 0) ? { text: '可回溯', cls: 'gain' } : { text: '不可用', cls: 'dim' };
    case 'foresight':   return { text: '剩' + s.foresight + '次', cls: s.foresight > 0 ? 'gain' : 'dim' };
    /* ---- 0.6.0 产业：已拥有显示"已拥有"，没钱的显示红价 ---- */
    case 'buy_factory':
    case 'buy_van':
    case 'hire_manager':
    case 'buy_clinic':
    case 'buy_branch':
    case 'buy_logistics': {
      var aid2 = id.replace('buy_', '').replace('hire_manager', 'manager');
      var as = Engine.findAsset(aid2);
      if (s.assets[as.id]) { return { text: '已拥有', cls: 'dim' }; }
      var wk = as.weekly ? (as.weekly > 0 ? '+' + money(as.weekly) + '/周' : money(as.weekly) + '/周') : '';
      var cls2 = lackCash(as.cost) ? 'lack' : 'cost';
      return { text: money(as.cost) + (wk ? ' · ' + wk : ''), cls: cls2 };
    }
    case 'recovery_course':
      return s.flags.dadRecovered ? { text: '已康复', cls: 'gain' }
        : (s.health < C.DAD_RECOVERY_HEALTH ? { text: '需健康' + C.DAD_RECOVERY_HEALTH, cls: 'dim' }
        : { text: money(C.DAD_RECOVERY_COST), cls: lackCash(C.DAD_RECOVERY_COST) ? 'lack' : 'gain' });
    default:            return null;
  }
}

function renderActions() {
  var boxes = {
    'actions-biz': $('actions-biz'),
    'actions-assets': $('actions-assets'),
    'actions-life': $('actions-life'),
    'actions-secret': $('actions-secret')
  };
  Object.keys(boxes).forEach(function (k) { boxes[k].innerHTML = ''; });

  var groups = {};
  ACTIONS.forEach(function (a) {
    (groups[a.group] = groups[a.group] || []).push(a);
  });

  Object.keys(groups).forEach(function (g) {
    var box = boxes[GROUP_TAB[g]] || boxes['actions-biz'];
    var h = document.createElement('h3'); h.textContent = g;
    var color = GROUP_COLORS[g] || '#cf7361';
    h.style.background = color;             // 分组标签用主题色
    var row = document.createElement('div'); row.className = 'btnrow';
    groups[g].forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'actbtn';
      b.style.borderLeftColor = color;      // 按钮左侧粗色条 = 分组主题色
      b.style.setProperty('--ac', color + '33');  // 图标气泡底色（主题色 20% 透明）
      // 一行式标注：成本/收益直接标在名字后（买不起自动变红）
      var tok = tokenFor(a);
      var tokHtml = tok ? '<span class="tok ' + tok.cls + '">' + tok.text + '</span>' : '';
      b.innerHTML = '<span class="ic">' + a.icon + '</span>' + a.name + tokHtml
                  + '<span class="hint">' + a.desc + '</span>';
      var check = Engine.canUseAction(state, a.id);
      b.disabled = !check.ok;
      if (!check.ok) { b.title = check.reason; }
      b.onclick = function () { doAction(a.id); };
      row.appendChild(b);
    });
    box.appendChild(h); box.appendChild(row);
  });
}

/* ---- 渲染：日志（从 state.log 全量重画，简单可靠） --------------------- */
function renderLog() {
  var panel = $('logpanel');
  panel.innerHTML = '';
  state.log.forEach(function (line) {
    var p = document.createElement('p');
    if (/^——/.test(line) || /^【第/.test(line)) { p.className = 'weekmark'; }
    p.textContent = line;
    panel.appendChild(p);
  });
  panel.scrollTop = panel.scrollHeight;   // 自动滚到最新
}

/* ---- 玩家操作 ---------------------------------------------------------- */
function doAction(id) {
  var r = Engine.performAction(state, id);
  if (r.error) { alert(r.error); return; }
  saveGame();
  render();
}

/** 结束本周：可能触发事件（弹窗），也可能直接进入下一周 */
function onEndWeek() {
  if (state.pendingEvent || state.ended) { return; }
  var r = Engine.endWeek(state);
  saveGame();
  render();
  if (r.event) { showEvent(r.event); }    // render 里也会弹，这里兜底
}

/** 在事件弹窗里点了一个选项 */
function onChoose(idx) {
  Engine.resolveEvent(state, idx);
  saveGame();
  render();
}

/* ---- 弹窗们 ------------------------------------------------------------ */
function showEvent(ev) {
  var d = $('dialog');
  var btns = ev.options.map(function (o, i) {
    return '<button onclick="onChoose(' + i + ')">' + o.label + '</button>';
  }).join('');
  d.innerHTML = '<h2>❗ ' + ev.title + '</h2>'
              + '<div class="body">' + ev.text + '</div>'
              + '<div class="choices">' + btns + '</div>';
  $('overlay').classList.add('show');
}

function showEnding() {
  var e = ENDINGS[state.ending] || { title: state.ending, text: '', rank: 0 };
  var d = $('dialog');
  var truth = (state.investigation >= CONFIG.TRUTH_NEED) ? '（调查进度 ' + state.investigation + '%，真相已明）' : '';
  // 结局配图：好结局父亲露出笑容；父亲病逝线用病容；其余按健康选
  var dadArt = 'dad_ok.png';
  if (state.ending === 'father_lost') { dadArt = 'dad_sick.png'; }
  else if (e.rank >= 3 && state.health >= 60) { dadArt = 'dad_happy.png'; }
  else if (state.health < 40) { dadArt = 'dad_sick.png'; }
  // 成就汇总（0.2.0）
  var unlocked = [];
  for (var key in (state.flags.achievements || {})) {
    if (state.flags.achievements.hasOwnProperty(key)) {
      for (var ai = 0; ai < ACHIEVEMENTS.length; ai++) {
        if (ACHIEVEMENTS[ai].id === key) { unlocked.push(ACHIEVEMENTS[ai].name); }
      }
    }
  }
  var achLine = unlocked.length
    ? '<div class="body" style="color:#b8742c;font-size:13px">🏆 本局成就 ' + unlocked.length + '/'
      + ACHIEVEMENTS.length + '：' + unlocked.join('、') + '</div>'
    : '<div class="body" style="color:#8a7a63;font-size:12px">本局没有解锁成就——下一局试试还债、查真相或攒魅力？</div>';
  d.innerHTML = '<div class="ending-title">—— 结局 ——</div>'
              + '<img src="../assets/' + dadArt + '" alt="父亲" '
              + 'style="display:block;margin:0 auto 8px;width:150px;border:3px solid #2f2a26;border-radius:14px;background:#f6ecd9">'
              + '<h2 class="ending-rank' + e.rank + '" style="text-align:center">' + e.title + '</h2>'
              + '<div class="body">' + e.text + '</div>'
              + '<div class="body" style="color:#8a8577;font-size:12px">'
              + '最终数据：撑过 ' + Math.min(state.week, CONFIG.MAX_WEEKS) + ' 周 · '
              + '剩余债务 ' + Engine.money(state.debt) + ' · '
              + '父亲健康 ' + state.health + ' · 声望 ' + state.reputation + truth + '</div>'
              + achLine
              + '<div class="choices"><button onclick="startNew()">再来一局</button></div>';
  $('overlay').classList.add('show');
}

function showStart() {
  var d = $('dialog');
  d.innerHTML = '<img src="../assets/hero.png" alt="主视觉" '
    + 'style="width:100%;border:1px solid #e9dcc6;border-radius:16px;margin-bottom:14px;background:#f6ecd9">'
    + '<h2>重生之我在破败家族力挽狂澜</h2>'
    + '<div class="body">你死于家族破产清算的雨夜，一睁眼回到三年前——老厂还在，父亲没倒，三叔刚露出獠牙。\n\n'
    + '<b>48 周，每周 3 点行动点。</b>\n'
    + '经营、还债、治病、查真相——改写结局。</div>'
    + '<div class="choices">'
    + '<button onclick="startNew()">▶ 开始新的挣扎</button>'
    + '<button id="btnContinue" style="display:none">↻ 继续上局的进度</button>'
    + '</div>';
  $('overlay').classList.add('show');
  var saved = loadGame();
  if (saved && !saved.ended) {
    $('btnContinue').style.display = 'block';
    $('btnContinue').onclick = function () {
      state = saved;
      render();
    };
  }
}

function showHelp() {
  var d = $('dialog');
  d.innerHTML = '<h2>玩法（3 行说完）</h2><div class="body">'
    + '① 每周 3 点行动点，在「经营/日常/暗线」页签里用，点「结束本周」结算（利息/工资/医疗）。\n'
    + '② 公司账户管经营，个人钱包管医疗和投机；转账收 10% 手续费。\n'
    + '③ 第 4 周起每 4 周一场危机，拍卖会在 6/14/22/30/38/46 周。共 9 种结局——真结局：清债+真相+健康70+声望60。</div>'
    + '<div class="choices"><button onclick="render()">知道了</button></div>';
  $('overlay').classList.add('show');
}

function hideOverlay() { $('overlay').classList.remove('show'); }

/* ---- 底部标签导航（手机版多模块切换） ---------------------------------- */
function switchTab(tabId) {
  document.querySelectorAll('#panels .panel').forEach(function (p) {
    p.classList.toggle('active', p.id === tabId);
  });
  document.querySelectorAll('#tabbar .tbtn').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
  });
  window.scrollTo(0, 0);
}

/* ---- 开新局 ------------------------------------------------------------ */
function startNew() {
  state = Engine.newGame();
  saveGame();
  render();
}

/* ---- 顶部系统按钮 + 底部标签栏 ---------------------------------------- */
/* 存档已自动化（每次操作后自动保存），不再需要手动保存按钮 */
$('btnEndWeek').onclick = onEndWeek;
$('btnHelp').onclick = showHelp;
$('btnRestart').onclick = function () {
  if (confirm('确定放弃当前进度、重新开始吗？')) { startNew(); }
};

/* ---- 说明开关：默认收起按钮下的长文案，界面更干净（偏好会记住） -------- */
function applyHints(on) {
  document.body.classList.toggle('show-hints', on);
  $('btnHints').textContent = on ? '📝 说明:开' : '📝 说明:关';
  try { localStorage.setItem('cs_show_hints', on ? '1' : '0'); } catch (e) {}
}
$('btnHints').onclick = function () {
  applyHints(!document.body.classList.contains('show-hints'));
};
try { applyHints(localStorage.getItem('cs_show_hints') === '1'); } catch (e) { applyHints(false); }

document.querySelectorAll('#tabbar .tbtn').forEach(function (b) {
  b.onclick = function () { switchTab(b.getAttribute('data-tab')); };
});

/* ---- 入口：显示开场画面 ------------------------------------------------ */
showStart();
</script>
</body>
</html>
